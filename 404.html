<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#062019">
    <title>העמוד לא נמצא - אמיר רובין</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        .nf-wrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: var(--g950); }
        .nf-wrap h1 { color: #fff; font-size: clamp(24px, 4vw, 36px); font-weight: 900; margin: 18px 0 10px; }
        .nf-wrap > p { color: rgba(255,255,255,0.8); font-size: 17px; max-width: 480px; margin: 0 auto 26px; }
        .nf-search { width: 100%; max-width: 420px; padding: 13px 16px; border: 0; border-radius: 12px; font: inherit; font-size: 15px; margin-bottom: 22px; }
        .nf-links { display: grid; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 26px; }
        .nf-links a { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #dff3ea; border-radius: 12px; padding: 12px 16px; text-decoration: none; font-size: 14.5px; font-weight: 600; text-align: start; }
        .nf-links a:hover { background: rgba(255,255,255,0.16); }
        .nf-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
<div class="nf-wrap">
    <div style="font-size:64px">🥑</div>
    <h1>העמוד הזה ירד במשקל... ונעלם</h1>
    <p>הקישור שהגעתם אליו כבר לא קיים - אבל יש כאן המון דברים טובים אחרים.</p>

    <input class="nf-search" type="search" id="nf-q" placeholder="🔍 חפשו מאמר... (חלבון, קפה, קריאטין)"
           onkeydown="if(event.key==='Enter'&&this.value.trim())location.href='/blog/?q='+encodeURIComponent(this.value.trim())">

    <div class="nf-links">
        <a href="/blog/post.html?p=protein-intake">🥚 כמה חלבון באמת צריך ביום?</a>
        <a href="/blog/post.html?p=creatine">💥 קריאטין - המדריך המלא</a>
        <a href="/blog/post.html?p=intermittent-fasting">⏰ צום לסירוגין - האם זה עובד?</a>
        <a href="/calculators.html">🔥 המחשבונים - כמה קלוריות אתם שורפים?</a>
    </div>

    <div class="nf-btns">
        <a class="btn btn-primary" href="/">לעמוד הבית</a>
        <a class="btn btn-wa" href="/first/">📅 לתיאום פגישה</a>
    </div>
</div>
</body>
</html>
